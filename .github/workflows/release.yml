name: Move the major tag

# When a release such as v1.2.3 is published, point the floating major tag (v1) at it, so
# `uses: AshwinSathian/loupe-action@v1` follows compatible releases. No third-party action is used.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    name: Update v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a vMAJOR.MINOR.PATCH release tag ($TAG); nothing to move."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
