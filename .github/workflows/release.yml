name: Move the major tag

# When a release such as v1.2.3 is published (not a prerelease, and the newest of its major), point the
# floating major tag (v1) at it, so `uses: AshwinSathian/loupe-action@v1` follows compatible releases.
# No third-party action is used.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    name: Update the major tag
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a vMAJOR.MINOR.PATCH release tag ($TAG); nothing to move."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # Never move the major tag backwards: only the highest vMAJOR.x.y release may own it.
          newest="$(git tag --list "$major.*" --sort=-v:refname | head -n1)"
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major where it is."
            exit 0
          fi
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
